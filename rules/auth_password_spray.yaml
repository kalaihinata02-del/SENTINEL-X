id: AUTH-002
title: Password Spraying Campaign Detected
description: Detects multiple failed authentication attempts originating from a single IP targeting diverse enterprise user accounts.
category: authentication
severity: high
status: enabled
author: SOC Detection Engineering Team
mitre_attack:
  tactic: Credential Access
  technique_id: T1110.003
  technique_name: Password Spraying
detection:
  condition_logic: all
  conditions:
    - field: action
      operator: equals
      value: logon_failed
    - field: event_category
      operator: equals
      value: authentication
  threshold: 3
  time_window_seconds: 120
  group_by:
    - src_ip
recommended_response: Enforce perimeter IP blocking. Review targeted accounts to verify if any lockouts or successful breaches occurred. Initiate immediate credential rotation for impacted identities.
soar_playbook: block_ip
tags:
  - password_spray
  - credential_access
  - active_directory

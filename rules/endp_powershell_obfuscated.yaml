id: ENDP-001
title: Obfuscated PowerShell Download Cradle Detected
description: Detects execution of PowerShell commands using encoded payloads, execution bypass switches, or in-memory download cradles (IEX/DownloadString).
category: endpoint
severity: critical
status: enabled
author: SOC Detection Engineering Team
mitre_attack:
  tactic: Execution
  technique_id: T1059.001
  technique_name: PowerShell Execution
detection:
  condition_logic: any
  conditions:
    - field: process_command_line
      operator: contains
      value: -enc
    - field: process_command_line
      operator: contains
      value: downloadstring
    - field: process_command_line
      operator: contains
      value: iex
    - field: process_command_line
      operator: contains
      value: -w hidden
  threshold: 1
  time_window_seconds: 30
  group_by:
    - hostname
recommended_response: Immediately isolate the affected workstation via EDR containment. Inspect parent process lineage, retrieve full command line string, decode Base64 payload, and search for dropped secondary staging binaries.
soar_playbook: isolate_host
tags:
  - powershell
  - execution
  - obfuscation
